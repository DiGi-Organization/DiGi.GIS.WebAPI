# =====================================================================
# DiGi GIS WebAPI Configuration — Committed Default
# =====================================================================
# This file ships deny-by-default values. CopyUserFiles runs after
# CopyFiles (AfterTargets="CopyFiles"), so 'user files/GIS_WebAPI.conf'
# always overwrites this file in bin/ when present.
#
# To enable write authentication and feature flags:
# 1. Copy this file to 'user files/GIS_WebAPI.conf'.
# 2. Set Enabled=true.
# 3. Define a secret access token for Key.
#
# ACCESS IS DENIED BY DEFAULT. If this file is absent, unreadable, has
# Enabled=false, or has a blank Key, every protected write endpoint
# answers HTTP 401. That is deliberate - do not "fix" it by relaxing the
# check.
#
# The key travels in the 'key' REQUEST HEADER, never in the query string:
#   curl -X POST -H "key: your_secret" https://host/gis/building2d/updateitems
# =====================================================================

# Enable write access key enforcement (true/false).
# false means "no key configured" -> protected write endpoints answer 401.
Enabled=false

# Secret access key, sent by callers in the 'key' request header.
Key=""

# LOCAL DEVELOPMENT ONLY. The single setting that waives the key check and
# leaves the protected tier reachable without credentials. Logs a warning
# whenever it is honoured. Never set this on a deployed host.
Open=false

# Feature flags controlling specific dataset update permissions:
AllowUpdateAdministrativeAreal2D=true
AllowUpdateBuilding2D=true
AllowUpdateBuilding=true
AllowUpdateBuildingData=true
AllowUpdateBuildingModel=true
AllowUpdateEPWFile=true
AllowUpdateOccupancyData=true
AllowUpdateOrtoDatas=true
AllowUpdateYearBuiltData=true

# Deleting year built data (whole objects, a prediction run, user entries by
# moderation) has no undo, so it has its own flag and ships denied.
AllowDeleteYearBuiltData=false

AllowUpdateUnit=true

# Storing a building's solar radiation from the Building Viewer's Calculate
# (gis/buildingsolarradiation/setsolarradiation). Authorized by the signed-in
# user's bearer token, not by Key, so this flag is the only switch. Ships
# denied; enable it on a host deliberately (DiGi.GIS.WebAPI.UI#75).
AllowUpdateSolarRadiationData=false
